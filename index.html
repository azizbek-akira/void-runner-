<script>
// Telegram Mini App: to'liq ekran, vertikal swipe bilan yopilishini o'chirish (Telegramdan tashqarida hech narsa qilmaydi)
(function () {
  try {
    var tg = window.Telegram && window.Telegram.WebApp;
    if (!tg) return;
    tg.ready();
    tg.expand();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    if (tg.setHeaderColor) tg.setHeaderColor('#040913');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#040913');
  } catch (e) {}
})();

<style>
  :root {
    --bg: #040913;
    --cy: #4dd8ff;
    --bl: #2f7bff;
    --txt: #e8f4ff;
    --dim: #8db3d6;
    --amber: #ffc857;
    --red: #ff4d6d;
    --ok: #5dffb0;
    --f: 'Rajdhani', 'Segoe UI', 'Roboto', system-ui, sans-serif;
    --ft: 'Orbitron', 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; min-height: 100dvh; margin: 0; background: #02050b;
    overflow: hidden; overscroll-behavior: none; touch-action: none;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: var(--f); color: var(--txt);
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #wrap {
    position: relative; width: 100%; height: 100dvh; max-width: 480px; margin: 0 auto;
    box-shadow: 0 0 0 1px rgba(77,216,255,0.14), 0 0 70px rgba(47,123,255,0.14);
  }
  canvas {
    display: block; width: 100%; height: 100%;
    background: radial-gradient(ellipse at 50% 0%, rgba(47,123,255,0.12), transparent 60%), var(--bg);
  }

  /* ---------- angular glass shapes (one technique for everything) ---------- */
  .cut, button, .chip, .panel, .item, .card {
    --c: 10px;
    position: relative; isolation: isolate;
    background: var(--b, linear-gradient(135deg, rgba(77,216,255,0.75), rgba(47,123,255,0.25) 60%, rgba(77,216,255,0.5)));
    clip-path: polygon(var(--c) 0, 100% 0, 100% calc(100% - var(--c)), calc(100% - var(--c)) 100%, 0 100%, 0 var(--c));
  }
  .cut::before, button::before, .chip::before, .panel::before, .item::before, .card::before {
    content: ''; position: absolute; inset: 1.2px; z-index: -1;
    clip-path: polygon(calc(var(--c) - 1px) 0, 100% 0, 100% calc(100% - var(--c) + 1px), calc(100% - var(--c) + 1px) 100%, 0 100%, 0 calc(var(--c) - 1px));
    background: var(--f0, linear-gradient(180deg, rgba(16,36,70,0.74), rgba(5,12,28,0.88)));
  }

  /* ---------- in-game HUD ---------- */
  #hud {
    position: absolute; z-index: 3; pointer-events: none;
    top: calc(8px + env(safe-area-inset-top, 0px)); left: 10px; right: 10px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  }
  .hud-l { display: flex; gap: 6px; align-items: stretch; min-width: 0; }
  .chip { --c: 8px; display: flex; flex-direction: column; justify-content: center; padding: 4px 11px; min-width: 40px; }
  .chip.row { flex-direction: row; align-items: center; gap: 6px; padding: 6px 12px; }
  .chip small { font: 600 9px/1 var(--f); letter-spacing: 2px; color: var(--dim); white-space: nowrap; }
  .chip b { font: 700 19px/1.1 var(--ft); letter-spacing: 1px; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(77,216,255,0.45); }
  .chip.row b { font-size: 15px; }
  .chip.row small { font-size: 10px; }
  .chip .ic { color: var(--amber); width: 15px; height: 15px; }
  .chip.lvl b { color: var(--cy); }
  .hearts { display: flex; align-items: center; gap: 3px; padding-top: 3px; }
  .hearts b { font: 700 15px/1 var(--ft); color: #ffd0d8; margin-left: 2px; }
  .hearts .ic { width: 18px; height: 18px; color: var(--red); fill: var(--red); stroke: #ffc2cc; filter: drop-shadow(0 0 4px rgba(255,77,109,0.6)); }
  .ic { width: 1.1em; height: 1.1em; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; flex: none; }

  /* ---------- round-ish control buttons ---------- */
  .ctl { position: absolute; z-index: 5; width: 40px; height: 40px; padding: 0; --c: 10px; display: flex; align-items: center; justify-content: center; font-size: 19px; color: var(--cy); }
  #muteBtn { top: calc(58px + env(safe-area-inset-top, 0px)); right: 10px; }
  #pauseBtn { top: calc(58px + env(safe-area-inset-top, 0px)); right: 56px; display: none; }
  #bombBtn {
    position: absolute; z-index: 5; display: none; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); right: 16px;
    width: 66px; height: 66px; padding: 0; --c: 19px; letter-spacing: 0; font: 700 21px/1 var(--ft); color: #fff;
    align-items: center; justify-content: center;
    --b: conic-gradient(var(--cy) calc(var(--p, 100) * 1%), rgba(255,255,255,0.16) 0);
    --f0: radial-gradient(circle at 50% 35%, rgba(30,70,130,0.95), rgba(5,14,32,0.95));
  }
  #bombBtn::before { inset: 3.5px; clip-path: polygon(calc(var(--c) - 2px) 0, calc(100% - var(--c) + 2px) 0, 100% calc(var(--c) - 2px), 100% calc(100% - var(--c) + 2px), calc(100% - var(--c) + 2px) 100%, calc(var(--c) - 2px) 100%, 0 calc(100% - var(--c) + 2px), 0 calc(var(--c) - 2px)); }
  #bombBtn { clip-path: polygon(var(--c) 0, calc(100% - var(--c)) 0, 100% var(--c), 100% calc(100% - var(--c)), calc(100% - var(--c)) 100%, var(--c) 100%, 0 calc(100% - var(--c)), 0 var(--c)); }
  #bombBtn.ready { animation: pulse 1.4s ease-in-out infinite; }

  @keyframes pulse { 50% { filter: brightness(1.35); } }

  /* ---------- buttons ---------- */
  button {
    appearance: none; -webkit-appearance: none; border: 0; cursor: pointer; text-transform: uppercase;
    font: 700 15px/1 var(--f); letter-spacing: 2px; color: var(--txt); padding: 14px 24px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;

  button.pri::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,0.35) 50%, transparent 65%); transform: translateX(-120%); animation: shine 3.2s ease-in-out infinite; pointer-events: none; }
  @keyframes shine { 55%, 100% { transform: translateX(120%); } }
  button.gold { --b: linear-gradient(135deg, rgba(255,200,87,0.95), rgba(255,140,40,0.45)); color: var(--amber); }
  button.danger { --b: linear-gradient(135deg, rgba(255,120,140,0.9), rgba(255,60,90,0.4)); color: #ffc2cc; }
  button.small:disabled { opacity: 0.3; pointer-events: none; }
  button.small { font-size: 13px; padding: 8px 12px; letter-spacing: 1px; white-space: nowrap; --c: 7px; }
  button.done { --f0: linear-gradient(180deg, rgba(40,120,90,0.55), rgba(8,40,36,0.85)); --b: linear-gradient(135deg, rgba(93,255,176,0.8), rgba(40,160,120,0.35)); color: var(--ok); }
  button.tab { font-size: 12px; padding: 9px 4px; letter-spacing: 1px; flex: 1; --c: 7px; opacity: 0.7; }
  button.tab.on { opacity: 1; --f0: linear-gradient(180deg, rgba(40,110,200,0.7), rgba(10,30,70,0.9)); color: #fff; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid3 button { flex-direction: column; gap: 6px; padding: 11px 4px; font-size: 11px; letter-spacing: 1px; --c: 9px; }
  .grid3 .ic { width: 22px; height: 22px; color: var(--cy); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red); vertical-align: middle; margin-left: 3px; }

  /* ---------- overlay screens ---------- */
  #overlay {
    position: absolute; inset: 0; z-index: 4; display: flex; overflow-x: hidden; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain;
    padding: calc(18px + env(safe-area-inset-top, 0px)) 16px calc(18px + env(safe-area-inset-bottom, 0px));
    background: radial-gradient(120% 55% at 50% 0%, rgba(47,123,255,0.24), transparent 65%), linear-gradient(180deg, rgba(3,7,16,0.62), rgba(3,7,16,0.9));
  }
  #overlay.hidden { display: none; }
  .lite #overlay { background: linear-gradient(180deg, rgba(3,7,16,0.82), rgba(3,7,16,0.94)); }
  .stack { width: 100%; max-width: 352px; margin: auto; display: flex; flex-direction: column; gap: 12px; text-align: center; }
  .kicker { font: 600 11px/1 var(--f); letter-spacing: 7px; color: var(--cy); text-transform: uppercase; opacity: 0.9; }
  h1.title { margin: 0; font: 800 clamp(22px, 7.6vw, 32px)/1.05 var(--ft); letter-spacing: clamp(2px, 1vw, 4px); background: linear-gradient(180deg, #fff, #9fe0ff 55%, #2f7bff); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px rgba(77,216,255,0.4)); }
  h2.h2 { margin: 0; font: 800 clamp(15px, 5.6vw, 22px)/1.15 var(--ft); letter-spacing: clamp(1px, 0.9vw, 4px); overflow-wrap: anywhere; text-wrap: balance; color: #fff; text-shadow: 0 0 14px rgba(77,216,255,0.55); }
  h2.h2.bad { color: #ffd0d8; text-shadow: 0 0 14px rgba(255,77,109,0.7); }
  .rule { height: 2px; background: linear-gradient(90deg, transparent, var(--cy), transparent); opacity: 0.55; margin: 2px 0; }
  .hero { position: relative; height: 150px; display: flex; align-items: center; justify-content: center; }
  .hero::before { content: ''; position: absolute; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(47,123,255,0.5), transparent 66%); }
  .hero img { position: relative; height: 128px; width: auto; max-width: 180px; object-fit: contain; animation: float 3.4s ease-in-out infinite; filter: drop-shadow(0 10px 14px rgba(0,0,0,0.65)); }

  .toast { font: 700 13px/1 var(--f); letter-spacing: 1px; color: var(--amber); }
  .tip { margin: 0; font: 500 13px/1.45 var(--f); color: var(--dim); letter-spacing: 0.5px; }

  .panel { --c: 14px; padding: 16px 14px; text-align: center; display: flex; flex-direction: column; gap: 10px; }
  .panel::after, .card.sel::after { content: ''; position: absolute; left: var(--c); top: 0; width: 56px; height: 2px; background: var(--cy); box-shadow: 0 0 8px var(--cy); }

  .tabs { display: flex; gap: 6px; }
  .shop-list { display: flex; flex-direction: column; gap: 8px; max-height: min(46dvh, 380px); overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; padding: 2px 2px 2px 0; text-align: left; }
  .item { --c: 9px; --b: linear-gradient(135deg, rgba(77,216,255,0.4), rgba(47,123,255,0.12)); display: flex; align-items: center; gap: 10px; padding: 9px 10px; font: 600 15px/1.15 var(--f); flex: none; }

  .item .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }

  .item .ok { color: var(--ok); }

  .pips i.own { background: rgba(255,200,87,0.55); }
  .upctl { display: flex; align-items: center; gap: 6px; }

  .upctl .lvn { min-width: 16px; text-align: center; font-size: 14px; }
  .pips i.next { background: rgba(255,200,87,0.55); }
  .bar { height: 5px; margin-top: 6px; background: rgba(255,255,255,0.12); transform: skewX(-25deg); overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--bl), var(--cy)); }
  .sect { font: 700 11px/1 var(--f); letter-spacing: 3px; color: var(--cy); text-align: left; padding: 8px 2px 0; }
  #wrap:has(#overlay:not(.hidden)) #hud { opacity: 0.18; }
  #wrap:has(#overlay:not(.hidden)) .ctl, #wrap:has(#overlay:not(.hidden)) #bombBtn { visibility: hidden; }
  .tog { --b: linear-gradient(135deg, rgba(141,179,214,0.55), rgba(141,179,214,0.18)); }
  .tog.on { --b: linear-gradient(135deg, rgba(77,216,255,0.95), rgba(47,123,255,0.5)); }
  .tog { position: relative; width: 52px; height: 26px; padding: 0; --c: 8px; --f0: rgba(255,255,255,0.08); flex: none; }
  .tog::after { content: ''; position: absolute; top: 4px; left: 5px; width: 18px; height: 18px; background: #8da2bd; clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px); transition: left 0.15s, background 0.15s; }
  .tog.on { --f0: linear-gradient(180deg, rgba(47,123,255,0.8), rgba(20,60,150,0.9)); }
  .tog.on::after { left: 27px; background: #fff; }
  .card { --c: 12px; width: 100%; text-align: left; padding: 12px 14px; display: flex; align-items: center; gap: 12px; letter-spacing: 0; text-transform: none; font: 600 15px/1.2 var(--f); --b: linear-gradient(135deg, var(--pc, #4dd8ff), rgba(47,123,255,0.25)); }
  .card .pic { width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; font: 800 20px/1 var(--ft); color: var(--pc); border: 2px solid var(--pc); border-radius: 50%; background: rgba(255,255,255,0.05); text-shadow: 0 0 10px var(--pc); }
  .card .pic.ic { width: 50px; height: 50px; border: 0; border-radius: 0; background: none; text-shadow: none; }

  .card .nm { flex: 1; min-width: 0; font-size: 17px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .card .nm small { display: block; font: 500 12.5px/1.3 var(--f); opacity: 0.8; letter-spacing: 0; text-transform: none; margin-top: 3px; }
  .card .tm { font: 700 12px/1 var(--ft); color: var(--dim); white-space: nowrap; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

  .stats b { font: 700 16px/1 var(--ft); }
  .big { font: 800 40px/1 var(--ft); letter-spacing: 2px; color: #fff; text-shadow: 0 0 18px rgba(77,216,255,0.6); font-variant-numeric: tabular-nums; }

</style>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('wrap');
  const overlay = document.getElementById('overlay');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const lvlEl = document.getElementById('lvl'), coinsEl = document.getElementById('coins'), recEl = document.getElementById('rec');
  const ICO = n => '<svg class="ic"><use href="#i-' + n + '"/></svg>';

      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);

    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);

  function steer(b) {
    let best = null, bd = 420 * 420;
    for (const e of enemies) {
      if (e.dead || e.y < -10 || e.y > H) continue;
      const d = (e.x - b.x) * (e.x - b.x) + (e.y - b.y) * (e.y - b.y);
      if (d < bd) { bd = d; best = e; }
    }
    if (!best) return;
    const sp = Math.hypot(b.vx, b.vy) || 5, dx = best.x - b.x, dy = best.y - b.y, dl = Math.hypot(dx, dy) || 1;
    b.vx += (dx / dl * sp - b.vx) * b.seek;
    b.vy += (dy / dl * sp - b.vy) * b.seek;
    const nl = Math.hypot(b.vx, b.vy) || 1;

  const FXS = {};

  function drawEnemy(en) {
    if (en.type === 'sniper') {                    // sniper = shooter hull inside a red targeting reticle
      const sp = SP.shooter;
      if (sp && sp.ok) drawEnemySprite(en, sp);
      const armed = en.aim !== undefined, k = tick * 0.04;
      ctx.save(); ctx.translate(en.x, en.y);
      ctx.strokeStyle = armed ? 'rgba(255,255,255,0.95)' : 'rgba(255,70,110,0.9)'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(0, 0, en.r + 8, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i < 4; i++) { const a = k + i * Math.PI / 2, c = Math.cos(a), sn = Math.sin(a); ctx.moveTo(c * (en.r + 4), sn * (en.r + 4)); ctx.lineTo(c * (en.r + 14), sn * (en.r + 14)); }
      ctx.stroke(); ctx.restore();
      return;
    }
    const sp = SP[en.type === 'boss' ? 'boss' + (en.pat || 0) : en.type];
    if (sp && sp.ok) { drawEnemySprite(en, sp); return; }
    if (en.type === 'boss') { drawBoss(en); return; }
    if (en.type !== 'drifter' && en.type !== 'shooter') { drawExtra(en); return; }
    const r = en.r, flash = en.hitFlash > 0;
    const shooter = en.type === 'shooter';
    ctx.save();
    ctx.translate(en.x, en.y);
    const g = ctx.createLinearGradient(0, -r, 0, r);
    if (shooter) { g.addColorStop(0, '#7a4a00'); g.addColorStop(1, '#ffb347'); }
    else { g.addColorStop(0, '#6b0f25'); g.addColorStop(1, '#ff3b5c'); }
    ctx.fillStyle = flash ? '#ffffff' : g;
    ctx.strokeStyle = flash ? '#ffffff' : (shooter ? '#ffe2b0' : '#ffb3c2');
    ctx.lineWidth = 1.2;
    ctx.shadowColor = shooter ? '#ffb347' : '#ff3b5c';
    ctx.shadowBlur = 0;
    if (shooter) {
      // twin cannons
      ctx.fillRect(-r * 0.75 - 1.5, r * 0.1, 3, r * 0.9);
      ctx.fillRect(r * 0.75 - 1.5, r * 0.1, 3, r * 0.9);
      poly([[0, r + 3], [-r * 0.9, r * 0.2], [-r - 5, -r * 0.6], [-r * 0.6, -r], [r * 0.6, -r], [r + 5, -r * 0.6], [r * 0.9, r * 0.2]]);
    } else {
      poly([[0, r + 5], [-r * 0.5, r * 0.1], [-r - 7, -r * 0.9], [-r * 0.5, -r * 0.4], [0, -r * 0.9], [r * 0.5, -r * 0.4], [r + 7, -r * 0.9], [r * 0.5, r * 0.1]]);
    }
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.stroke();
    // glowing eye / core
    ctx.fillStyle = flash ? '#ff3b5c' : (shooter ? '#fff3c4' : '#ffe14d');
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(0, shooter ? -1 : 0, r * (shooter ? 0.32 : 0.26), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function buildNebula() {
    nebula = document.createElement('canvas');
    nebula.width = Math.max(1, Math.floor(W));
    nebula.height = Math.max(1, Math.floor(H));
    const c = nebula.getContext('2d');
    const mp = MAPS[save.map];
    if (mp.img && SP[mp.img] && SP[mp.img].ok) {
      const im = SP[mp.img].im, k = Math.max(W / im.width, H / im.height), dw = im.width * k, dh = im.height * k;
      c.drawImage(im, (W - dw) / 2, (H - dh) / 2, dw, dh);
      return;
    }
    const n1 = c.createRadialGradient(W*0.2, H*0.25, 0, W*0.2, H*0.25, W*0.7);
    n1.addColorStop(0, 'rgba(' + mp.n1 + ',0.22)'); n1.addColorStop(1, 'rgba(' + mp.n1 + ',0)');
    c.fillStyle = n1; c.fillRect(0, 0, W, H);
    const n2 = c.createRadialGradient(W*0.85, H*0.75, 0, W*0.85, H*0.75, W*0.8);
    n2.addColorStop(0, 'rgba(' + mp.n2 + ',0.16)'); n2.addColorStop(1, 'rgba(' + mp.n2 + ',0)');
    c.fillStyle = n2; c.fillRect(0, 0, W, H);
  }

  function planetSprite(p) {
    const d = Math.ceil(p.r * 2) + 2;
    const cv = document.createElement('canvas');
    cv.width = d; cv.height = d;
    const c = cv.getContext('2d');
    const g = c.createRadialGradient(p.r*0.6, p.r*0.6, p.r*0.1, p.r+1, p.r+1, p.r);
    g.addColorStop(0, p.c1); g.addColorStop(1, p.c2);
    c.fillStyle = g;
    c.beginPath(); c.arc(p.r+1, p.r+1, p.r, 0, Math.PI * 2); c.fill();
    p.sprite = cv; p.spriteR = p.r;
  }

  function drawBackground() {
    if (nebula) ctx.drawImage(nebula, 0, 0, W, H);
    for (const p of planets) {
      if (!p.sprite || p.spriteR !== p.r) planetSprite(p);
      if (p.ring) {
        ctx.strokeStyle = 'rgba(200,220,255,0.35)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * 1.7, p.r * 0.45, -0.35, Math.PI, Math.PI * 2); ctx.stroke();
      }
      ctx.drawImage(p.sprite, p.x - p.r - 1, p.y - p.r - 1);
      if (p.ring) {
        ctx.strokeStyle = 'rgba(200,220,255,0.55)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * 1.7, p.r * 0.45, -0.35, 0, Math.PI); ctx.stroke();
      }
    }
  }

  function drawTimers() {
    const items = [];
    if (weaponTimer > 0) items.push([WEAPONS[wtype].n.toUpperCase() + ' ' + weapon, weaponTimer, WEAPONS[wtype].c]);
    if (shield > 0) items.push(['SHIELD', shield, '#4dd8ff']);
    ctx.save();
    ctx.font = '700 13px ' + UIF;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    let cx = 12, cy = H - 20 - items.length * 20 - 12;
    ctx.font = '700 11px ' + UIF;
    Object.keys(perks).forEach(k => {          // one chip per perk: time bar + level, blinks in the last 5 s
      if (!PERKS[k] || !perkT[k]) return;
      if (cx + 30 > W - 80) { cx = 12; cy -= 16; }
      const left = perkT[k], blink = left < 300 && Math.floor(tick / 8) % 2 === 0;
      ctx.globalAlpha = blink ? 0.3 : 1;
      ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(cx, cy, 30, 13);
      ctx.fillStyle = PERKS[k].c; ctx.fillRect(cx, cy + 10, 30 * Math.min(1, left / perkM[k]), 3);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
      ctx.fillText(PERKS[k].s + (perks[k] > 1 ? perks[k] : ''), cx + 15, cy + 5);
      ctx.globalAlpha = 1; ctx.textAlign = 'left';
      cx += 33;
    });
    ctx.font = '700 13px ' + UIF;
    items.forEach((it, i) => {
      const y = H - 16 - i * 20, w = 80;
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(12, y - 5, w, 10);
      ctx.fillStyle = it[2]; ctx.fillRect(12, y - 5, w * it[1] / boostDur(), 10);
      ctx.fillText(it[0] + ' ' + Math.ceil(it[1] / 60) + 's', 12 + w + 8, y);
    });
    ctx.restore();
  }

  function spawnPowerup(x, y) {
    const t = Math.random();
    let type = t < 0.24 ? 'weapon' : (t < 0.34 ? 'wswap' : (t < 0.41 ? 'shield' : (t < 0.47 ? 'life' : 'coin')));
    if (type === 'shield' && shield > 0) type = 'coin';       // no stacking shields: a coin drops instead
    powerups.push({ x: x === undefined ? 30 + Math.random() * (W - 60) : Math.max(20, Math.min(W - 20, x)), y: y === undefined ? -20 : y, r: 12, type });
  }

  function collect(p) {
    if (p.type === 'weapon' || p.type === 'shield' || p.type === 'wswap') questEvent('pickup');
    sfx.pickup();
    if (p.type === 'weapon') {
      if (weapon < 3) weapon++; else score += 50;
      weaponTimer = boostDur();
      explode(p.x, p.y, '255,225,77', 12);
    } else if (p.type === 'wswap') {
      const opts = Object.keys(WEAPONS).filter(k => k !== wtype);
      wtype = opts[Math.floor(Math.random() * opts.length)];
      weaponTimer = boostDur();
      showBanner('QUROL: ' + WEAPONS[wtype].n.toUpperCase());
      explode(p.x, p.y, '255,154,60', 12);
    } else if (p.type === 'shield') {
      shield = boostDur();
      explode(p.x, p.y, '77,216,255', 12);
    } else if (p.type === 'coin') {
      addCoins(5);
      floats.push({ x: p.x, y: p.y, t: '+5 ◎', life: 40, c: '#7dffb0' });
      explode(p.x, p.y, '125,255,176', 10);
    } else {
      if (lives < 5) lives++; else score += 50;
      explode(p.x, p.y, '255,59,92', 12);
    }
    updateHud();
  }

  const PU_GLOW = { weapon: '255,205,60', wswap: '255,150,50', shield: '77,216,255', coin: '255,210,80', life: '255,80,100' };
  function drawPowerup(p) {
    const ic = SP['ic_' + p.type];
    if (ic && ic.ok) {                       // image badge with a soft glow in the power-up's own colour
      const pulse = 1 + Math.sin(tick * 0.15) * 0.08;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.scale(pulse, pulse);
      if (!save.settings.lite) {
        const g = glowSprite(PU_GLOW[p.type] || '255,255,255');
        ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.5;
        ctx.drawImage(g.c, -28, -28, 56, 56);
        ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      }
      ctx.drawImage(ic.im, -15, -15, 30, 30);
      ctx.restore();
      return;
    }
    const col = p.type === 'weapon' ? '#ffe14d' : (p.type === 'wswap' ? '#ff9a3c' : (p.type === 'shield' ? '#4dd8ff' : (p.type === 'coin' ? '#7dffb0' : '#ff3b5c')));
    const label = p.type === 'weapon' ? 'P' : (p.type === 'wswap' ? 'W' : (p.type === 'shield' ? 'S' : (p.type === 'coin' ? '◎' : '♥')));
    const pulse = 1 + Math.sin(tick * 0.15) * 0.12;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(pulse, pulse);
    ctx.shadowColor = col; ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(5,7,10,0.85)';
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = col;
    ctx.font = '700 16px ' + UIF;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, 0, 1);
    ctx.restore();
  }

  // Fixed-timestep loop: game logic always runs at 60 steps/second,
  // whatever the screen refresh rate is (30/60/90/120/144 Hz).
  const STEP = 1000 / 60;
  let acc = 0, lastTs = 0;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (!lastTs) lastTs = ts;
    let dt = ts - lastTs; lastTs = ts;
    if (dt > 100) dt = 100;            // tab was in background: don't fast-forward
    acc += dt;
    let steps = 0;
    while (acc >= STEP - 1 && steps < 4) { update(); acc -= STEP; steps++; }
    if (steps === 4) acc = 0;          // too slow: drop the backlog
    if (steps) render();
  }

  function update() {
    tick++;
    shake = shake > 0.4 ? shake * 0.88 : 0;
    for (const s of stars) {
      s.y += s.sp;
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    }
    for (const p of planets) {
      p.y += p.sp;
      if (p.y - p.r * 2 > H) { p.y = -p.r * 2; p.x = p.r + Math.random() * (W - p.r * 2); }
    }
    if (shockwave && ++shockwave.t >= 30) shockwave = null;
    if (banner && banner.t > 0) banner.t--;

    if (state === 'perk' && perkGuard > 0) perkGuard--;
    if (state === 'playing') {
      if (perkPending && !enemies.some(e => e.type === 'boss')) { perkPending = false; openPerks(); return; }
      // drones circle the ship and fire on their own
      for (let i = 0; i < (perks.drone || 0); i++) {
        if ((tick + i * 17) % 50 === 0) { const d = dronePos(i); bullets.push({ x: d.x, y: d.y, vx: 0, vy: -8, k: 'b', dmg: 0.6 }); }
      }
      // auto-shoot
      shoot();
      if (player.cooldown > 0) player.cooldown--;

      // move player toward target
      const kx = (keys['arrowright'] || keys['d'] ? 1 : 0) - (keys['arrowleft'] || keys['a'] ? 1 : 0);
      const ky = (keys['arrowdown'] || keys['s'] ? 1 : 0) - (keys['arrowup'] || keys['w'] ? 1 : 0);
      player.targetX += kx * 7;
      player.targetY += ky * 7;
      player.targetX = Math.max(18, Math.min(W-18, player.targetX));
      player.targetY = Math.max(H * 0.15, Math.min(H-30, player.targetY));
      player.x += (player.targetX - player.x) * (SK().move || 0.18);
      player.y += (player.targetY - player.y) * (SK().move || 0.18);
      player.x = Math.max(18, Math.min(W-18, player.x));
      player.y = Math.max(H * 0.15, Math.min(H-30, player.y));

      // spawn enemies, ramping difficulty
      const bossAlive = enemies.some(e => e.type === 'boss');
      const spawnRate = Math.round(spawnRateFor(level) * (bossAlive ? 2 : 1));
      if (tick % spawnRate === 0) spawnEnemy();
      if (!bossAlive && level >= nextBossLevel) spawnBoss();
      if (!bossAlive && level >= 5 && --waveCd <= 0) { spawnWave(); waveCd = Math.max(420, 900 - level * 12); }
      runTicks++;
      for (const k in perkT) {                       // timed perks: 75 s, then step down one level (25 s each)
        if (--perkT[k] > 0) continue;
        const lvl = --perks[k];
        floats.push({ x: player.x, y: player.y - 34, t: PERKS[k].n + ' \u2193', life: 50, c: PERKS[k].c });
        if (lvl > 0) perkT[k] = perkM[k] = PERK_DECAY; else { delete perks[k]; delete perkT[k]; delete perkM[k]; }
      }
      if (invuln > 0) invuln--;
      if (bombCd > 0) bombCd--;
      if (comboTimer > 0 && --comboTimer === 0) combo = 0;
      floats.forEach(f => { f.y -= 0.8; f.life--; });
      floats = floats.filter(f => f.life > 0);

      // engine trail particles (cosmetic, only when a trail is equipped)
      if (save.trail > 0 && !save.settings.lite && tick % 2 === 0) particles.push({ x: player.x + (Math.random() - 0.5) * 6, y: player.y + 26, vx: (Math.random() - 0.5) * 0.4, vy: 1.2, life: 16, color: trailRGB() });

      // power-ups
      if (!save.hints.move && tick > 20) showHint('move', 'Kemani sudrang  (barmoq / sichqoncha / WASD)');
      else if (!save.hints.shoot && tick > 300) showHint('shoot', "Kema o'zi otadi: dushmanlarni yo'q qiling");
      else if (!save.hints.bomb && bombCd === 0) showHint('bomb', 'Bomba tayyor!  💥 tugma yoki Space');
      else if (!save.hints.combo && combo >= 3) showHint('combo', "Kombo: ketma-ket o'ldiring, ball ko'payadi");
      else if (!save.hints.wsw && powerups.some(q => q.type === 'wswap')) showHint('wsw', 'W: qurol turini almashtiradi (lazer, raketa, sochma)');
      else if (!save.hints.pu && powerups.length) showHint('pu', "P qurol, S qalqon, ♥ jon, ◎ tanga: ularni oling");
      if (hint && hint.t > 0) hint.t--; else hint = null;
      if (--puCd <= 0) { spawnPowerup(); puCd = 1700 + Math.floor(Math.random() * 500); }
      if (shield > 0) shield--;
      if (weaponTimer > 0 && --weaponTimer === 0) { weapon = 1; wtype = 'blaster'; updateHud(); }
      powerups.forEach(p => {
        p.y += 1.4;
        const mg = save.up.magnet + 1.5 * (perks.magnet || 0);
        if (mg > 0) {                             // magnet pulls power-ups toward the ship
          const dx = player.x - p.x, dy = player.y - p.y, d = Math.hypot(dx, dy), R = 60 + 55 * mg;
          if (d < R && d > 1) { p.x += dx / d * 3.2; p.y += dy / d * 3.2; }
        }
        if (circleHit(player, p)) { p.dead = true; collect(p); }
      });
      powerups = powerups.filter(p => !p.dead && p.y < H + 30);

      // bullets
      bullets.forEach(b => { if (b.seek) steer(b); b.y += b.vy; b.x += b.vx; if (b.life !== undefined) b.life--; });
      bullets = bullets.filter(b => b.y > -30 && b.y < H + 30 && b.x > -30 && b.x < W + 30 && !(b.life <= 0));

      enemyBullets.forEach(b => { b.y += b.vy; b.x += b.vx || 0; });
      enemyBullets = enemyBullets.filter(b => b.y < H+20 && b.x > -20 && b.x < W+20);

      // enemies
      enemies.forEach(en => {
        if (en.type === 'boss') {
          if (en.y < H * 0.16) en.y += 1.2;
          const fast = en.p2 ? 1.3 : 1;
          en.x = W / 2 + Math.sin(tick * [0.02, 0.014, 0.03][en.pat] * fast + en.ph) * (W * en.wide);
          if (en.hitFlash > 0) en.hitFlash--;
          if (!en.p2 && en.hp <= en.maxHp / 2) { en.p2 = true; shake = Math.max(shake, 12); showBanner("BOSS G'AZABLANDI!"); sfx.warn(); }
          const B = (x, y, vx, vy) => enemyBullets.push({ x, y, vx, vy, src: 'boss' });
          const dbl = enemies.filter(e => e.type === 'boss' && !e.dead).length > 1;   // two bosses: each fires less often
          if (en.y >= H * 0.16) {
            const bx = en.x, by = en.y + en.r, bv = bulletSpeedFor(level);
            if (en.pat === 1) { // spiral bursts (phase 2: mirrored double spiral, longer bursts)
              if (en.pause > 0) en.pause--;
              else if (tick % (dbl ? 10 : 7) === 0) {
                en.ang += 0.55;
                const a = Math.PI / 2 + Math.sin(en.ang) * 1.2;
                B(bx, by, Math.cos(a) * 2.8 * bv, Math.sin(a) * 2.8 * bv);
                if (en.p2) B(bx, by, -Math.cos(a) * 2.8 * bv, Math.sin(a) * 2.8 * bv);
                if (++en.n >= (en.p2 ? 26 : 18)) { en.n = 0; en.pause = en.p2 ? 70 : 100; }
              }
            } else if (bossCd(en) <= 0) {
              const cdMul = (en.p2 ? 0.7 : 1) * (dbl ? 1.4 : 1);
              if (en.pat === 2) { // aimed shots (phase 2: five-shot, faster)
                const base = en.aim !== undefined ? en.aim : Math.atan2(player.y - en.y, player.x - en.x), k = en.p2 ? 5 : 3, sp = (en.p2 ? 4.0 : 3.6) * bv;
                for (let i = 0; i < k; i++) { const a = base + (i - (k - 1) / 2) * 0.16; B(bx, by, Math.cos(a) * sp, Math.sin(a) * sp); }
                en.shootCd = Math.max(30 * (dbl ? 1.4 : 1), (70 - level * 2) * cdMul); en.aim = undefined;
              } else { // fan (phase 2 adds periodic half-ring bursts)
                const n = level >= 6 ? 5 : 3;
                for (let i = 0; i < n; i++) { const a = (i - (n - 1) / 2) * 0.28; B(bx, by, Math.sin(a) * 3.2 * bv, Math.cos(a) * 3.2 * bv); }
                en.shootCd = Math.max(30 * (dbl ? 1.4 : 1), (80 - level * 3) * cdMul);
              }
            }
            if (en.p2 && en.pat === 0 && --en.ringCd <= 0) {
              for (let i = 0; i < 9; i++) { const a = 0.25 + i * (Math.PI - 0.5) / 8; B(bx, by, Math.cos(a) * 2.6 * bv, Math.sin(a) * 2.6 * bv); }
              en.ringCd = dbl ? 210 : 150;
            }
          }
          return;
        }
        en.age = (en.age || 0) + 1;
        if (en.type === 'zigzag') {
          en.y += en.vy;
          en.x = Math.max(16, Math.min(W - 16, en.bx + Math.sin(en.age * 0.06) * en.amp));
        } else if (en.type === 'kamikaze') {
          if (!en.locked && en.y > H * 0.1) {
            en.locked = true;
            const a = Math.atan2(player.y - en.y, player.x - en.x);
            en.vx = Math.cos(a) * en.dash; en.vy = Math.sin(a) * en.dash;
          }
          en.y += en.vy; en.x += en.vx;
        } else if (en.type === 'sniper') {            // glides in, hovers and snipes, then leaves
          if (en.y < en.hy) en.y += en.vy;
          else { en.x = Math.max(20, Math.min(W - 20, en.x + Math.sin(tick * 0.03 + en.ph) * 0.8)); if (--en.hold <= 0) en.y += 1.5; }
        } else {
          en.y += en.vy;
          en.x += en.vx;
          if (en.x < 16 || en.x > W-16) en.vx *= -1;
        }
        if (en.rot !== undefined) en.rot += en.vr;
        if (en.hitFlash > 0) en.hitFlash--;
        if (en.type === 'tank') {
          en.shootCd--;
          if (en.shootCd <= 0 && en.y > 0 && en.y < H * 0.6) {
            for (let i = -1; i <= 1; i++) enemyBullets.push({ x: en.x, y: en.y + 14, vx: i * 0.9, vy: 3 * bulletSpeedFor(level), src: 'tank' });
            en.shootCd = 130 * fireMul(level);
          }
        }
        if (en.type === 'shooter') {
          en.shootCd--;
          if (en.shootCd <= 0 && en.y > 0 && en.y < H*0.7) {
            if (en.elite || level >= 85) { for (let i = -1; i <= 1; i++) enemyBullets.push({ x: en.x, y: en.y + 12, vx: i * 0.8, vy: 3.4 * bulletSpeedFor(level), src: 'shooter' }); }
            else enemyBullets.push({ x: en.x, y: en.y+12, vy: 3.4 * bulletSpeedFor(level), src: 'shooter' });
            en.shootCd = (90 + Math.random()*40) * fireMul(level);
          }
        }
        if (en.type === 'sniper') {                    // aim is locked 20 ticks before the volley and shown as warning lines
          en.shootCd--;
          if (en.shootCd === 20) en.aim = Math.atan2(player.y - en.y, player.x - en.x);
          if (en.shootCd <= 0) {
            if (en.y > 0 && en.y < H * 0.6) {

  function loadSprites() {
    for (const k in SPR) {
      const d = SPR[k], im = new Image();
      const sp = SP[k] = { w: d.w, h: d.h, fl: d.fl || [], ok: false, im };
      im.onload = () => {
        const c = document.createElement('canvas');
        c.width = im.width; c.height = im.height;
        const x = c.getContext('2d');
        x.drawImage(im, 0, 0);
        x.globalCompositeOperation = 'source-atop';
        x.fillStyle = 'rgba(255,255,255,0.75)';
        x.fillRect(0, 0, c.width, c.height);
        sp.imf = c; sp.ok = true;
        if (MAPS.some(m => m.img === k)) buildNebula();
      };
      im.src = d.src;
    }
